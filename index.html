<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    color:white;
    text-align:center;
    overflow:hidden;
}

.container{
    margin-top:80px;
}

img{
    width:250px;
    height:250px;
    object-fit:cover;
    border-radius:50%;
    border:5px solid white;
    margin-bottom:20px;
}

h1{
    font-size:3rem;
    margin-bottom:20px;
}

p{
    font-size:1.3rem;
    margin-bottom:30px;
}

button{
    padding:15px 30px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:white;
    color:#ff4081;
    font-weight:bold;
}

button:hover{
    transform:scale(1.05);
}

.heart{
    position:absolute;
    color:red;
    font-size:20px;
    animation:fall 5s linear infinite;
}

@keyframes fall{
    from{
        transform:translateY(-100px);
    }
    to{
        transform:translateY(100vh);
    }
}
</style>
</head>

<body>

<div class="container">

    <img src="photo.jpg.jpeg" alt="My Love">

    <h1>🎂 Happy Birthday My POTATO ❤️</h1>

    <p>
        Every day with you is a beautiful gift.<br>
        May your birthday be filled with happiness, love and smiles. 💖
    </p>

    <button onclick="showMessage()">Open Surprise 🎁</button>

</div>

<script>
function showMessage(){
    alert("Happy Birthday My POTATO ❤️\nYou mean everything to me! 💖");
}

for(let i=0;i<30;i++){
    let heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="❤️";
    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(3+Math.random()*5)+"s";
    document.body.appendChild(heart);
}
</script>

</body>
</html>
